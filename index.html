<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ChatGPT Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button id="close-sidebar-button" aria-label="Close sidebar">&times;</button>
            </div>
            <ul id="chat-history">
                <!-- Chat history items will be populated here -->
            </ul>
        </aside>
        <main class="chat-area">
            <div class="chat-content-wrapper"> <!-- New wrapper -->
                <header class="chat-header">
                    <button id="menu-button" aria-label="Open sidebar">&#9776;</button> <!-- Hamburger Icon -->
                    <div class="model-selection">
                        <label for="model-select">Model:</label>
                    <select id="model-select">
                        <!-- Options will be populated by JavaScript -->
                        <option value="gpt-3.5-turbo">GPT-3.5-Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <!-- Add more models as needed -->
                    </select>
                </div>
                <div class="token-usage-cost" id="token-usage-cost">
                    <p>Tokens: <span id="token-count">0</span></p>
                    <p>Cost: $<span id="cost-display">0.00</span></p>
                </div>
            </header>
            <div class="messages-area" id="messages-area">
                <!-- Chat messages will be displayed here -->
            </div>
            <footer class="input-area">
                <div class="input-wrapper">
                    <button id="advanced-input-button" aria-label="Advanced input options">&#10010;</button> <!-- Plus icon -->
                    <textarea id="message-input" placeholder="Send a message..."></textarea>
                    <button id="send-button" aria-label="Send message"></button>
                </div>
                <div id="advanced-input-popover" class="popover">
                    <button data-feature="upload-image">Upload Image</button>
                    <button data-feature="search-web">Search Web</button>
                    <button data-feature="think-longer">Think Longer</button>
                    <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
                </div>
            </footer>
            </div> <!-- End of chat-content-wrapper -->
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
